[env:esp32dev]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
upload_speed = 921600

lib_deps =
    https://github.com/simplefoc/Arduino-FOC.git#v2.3.3
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14

; ESP32(WROOM-32) / MKS ESP32 FOC V1.0
; SimpleFOC は ESP32 では LEDC/MCPWM ドライバを自動選択します。
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=256

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF